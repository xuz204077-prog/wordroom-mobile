  <style>
:root {
  color-scheme: light;
  --paper: #f7f6f0;
  --surface: #faf9f5;
  --ink: #20271d;
  --muted: #626957;
  --line: #343b2c;
  --divider: #d9dbce;
  --track: #dedfd4;
  --soft: #e9f2cf;
  --tint: #eff4df;
  --accent: #caeb68;
  --serif: Georgia, "Songti SC", "Noto Serif CJK SC", SimSun, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .48; }
button, input, select { -webkit-tap-highlight-color: transparent; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #688326; outline-offset: 3px; }
button, h1, h2, h3, p { margin: 0; }
button { border: 0; }
[hidden] { display: none !important; }
svg { display: block; flex-shrink: 0; }
.shell { width: min(1440px, calc(100% - 56px)); margin: auto; }
.site-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 26px 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 16px; text-align: left; background: none; padding: 0; }
.brand strong, .brand small { display: block; font-family: var(--serif); }
.brand strong { font-size: 34px; line-height: 1.05; }
.brand small { font-size: 15px; letter-spacing: .13em; margin-top: 4px; }
nav { display: flex; gap: 22px; }
.nav-button, .button, .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 11px; min-height: 44px; }
.nav-button { padding: 7px 18px; font: 700 22px var(--serif); background: transparent; }
.nav-button[aria-current="page"] { background: #dcefab; }
.nav-button:hover, .outline:hover, .icon-button:hover, .aside-row:is(button):hover { background: var(--tint); }
.button { padding: 10px 22px; background: transparent; font-weight: 600; }
.outline, .icon-button { border: 1px solid var(--line); }
.icon-button { background: transparent; width: 48px; height: 48px; padding: 0; }
.icon-button[aria-pressed="true"], .outline[aria-pressed="true"] { background: var(--soft); }
.icon-button[aria-pressed="true"] svg { fill: #b1ca70; }
.primary { background: var(--accent); border: 1px solid transparent; }
.primary:hover { background: #bce34f; }
.wide { width: 100%; }
.page-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 31px 17px 28px; }
h1, h2, h3 { font-family: var(--serif); line-height: 1.2; }
h1 { font-size: clamp(34px, 3.4vw, 52px); letter-spacing: -.035em; }
.page-heading p { margin-top: 9px; color: #434b39; font: 22px/1.4 var(--serif); }
.layout { display: grid; grid-template-columns: minmax(0, 2.14fr) minmax(255px, 1fr); gap: 24px; align-items: start; }
.panel, .flashcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.flashcard { padding: 24px 30px 28px; border-radius: 23px; }
.card-top, .card-progress, .stats-header, .aside-row, .dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }

.card-progress { margin-top: 24px; font: 21px/1.25 var(--serif); font-variant-numeric: tabular-nums; }
.meter { overflow: hidden; height: 12px; border-radius: 20px; background: var(--track); }
.meter > span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .22s ease; }
.card-progress .meter { flex: 1; }
.word-face { text-align: center; display: grid; align-content: center; justify-items: center; padding: 32px 0 31px; min-height: clamp(210px, 19vw, 290px); }
.word-face h2 { font-size: clamp(60px, 8.8vw, 132px); line-height: .98; letter-spacing: -.055em; overflow-wrap: anywhere; max-width: 100%; }
.word-face h2.long { font-size: clamp(36px, 5.8vw, 86px); line-height: 1.04; }
.word-face h2.phrase { font-size: clamp(32px, 4.8vw, 72px); line-height: 1.06; }
.pronounce { display: flex; align-items: center; gap: 12px; margin-top: 19px; font: clamp(20px, 2.4vw, 33px)/1.2 var(--serif); color: #46503b; }
.pronounce .icon-button { width: 46px; height: 44px; border: 0; }
.example { border-radius: 13px; background: var(--tint); padding: 19px 24px 21px; }

.example p[lang] { margin-top: 9px; font: clamp(21px, 2.3vw, 34px)/1.35 var(--serif); }
.example .translation { margin-top: 8px; font-size: 15px; color: var(--muted); }
.answer { padding: 20px 0 16px; margin-top: 3px; border-top: 1px solid var(--divider); }
.answer h3 { font-size: 26px; margin-top: 3px; line-height: 1.42; }
.answer .pos { color: var(--muted); font: italic 16px var(--serif); }
.related-label { color: var(--muted); font-size: 13px; margin: 14px 0 7px; }
.related { display: flex; flex-wrap: wrap; gap: 7px; }
.related span { padding: 4px 10px; border: 1px solid #dce6bf; background: #f2f5e9; border-radius: 7px; font-size: 14px; overflow-wrap: anywhere; }
.actions { margin-top: 22px; }
.actions .primary { min-height: 54px; font: 700 23px var(--serif); }
.grade-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
.grade-buttons .button { display: grid; gap: 0; min-height: 64px; padding: 6px; }
.grade-buttons small { font-weight: 400; font: 12px var(--sans); }
.keyboard { text-align: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
.stats { padding: 22px 24px 11px; }
.stats-header h2, .groups h2 { font-size: 28px; }
.stats-header span { font: 22px var(--serif); white-space: nowrap; }
.stats .meter { margin: 21px 0 24px; }
.aside-row { width: 100%; min-height: 53px; text-align: left; padding: 0 5px; border-top: 1px solid var(--divider); font: 20px var(--serif); background: transparent; }
.aside-row span:first-of-type { flex: 1; }
.aside-row strong { font-weight: 400; font-variant-numeric: tabular-nums; }
.groups { padding: 18px 13px 12px; margin-top: 24px; }
.groups h2 { padding: 0 12px; margin: 0 0 17px; }
.groups .aside-row { padding: 0 13px; }
.groups .aside-row:first-child, .groups .aside-row[aria-pressed="true"], .groups .aside-row[aria-pressed="true"] + .aside-row { border-top-color: transparent; }
.groups .aside-row[aria-pressed="true"] { background: #e5f1c2; border-radius: 10px; }
footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 23px; padding: 12px 16px 17px; border-top: 1px solid var(--line); font: 15px/1.4 var(--serif); color: #424a38; }
.footer-status { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 14px; }
#offline-status { color: #4e681d; }
#offline-status:empty { display: none; }
.complete { text-align: center; padding: 70px 28px; }
.complete svg { margin: 0 auto 16px; color: #60752b; }
.complete h2 { font-size: 38px; }
.complete p { color: var(--muted); margin: 13px 0 26px; }
.complete-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
#library { padding: 24px 28px; min-width: 0; }
.library-controls { display: flex; gap: 12px; }
.search-field { display: flex; flex: 1; min-width: 0; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; }
.search-field input { width: 100%; min-width: 0; min-height: 44px; border: 0; background: none; }
.result-count { color: var(--muted); margin: 17px 0 9px; font-size: 13px; }
.word-row { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--divider); }
.word-link { min-width: 0; flex: 1; display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1fr); align-items: center; gap: 9px; text-align: left; background: transparent; padding: 13px 3px; border-radius: 6px; }
.word-link:hover { background: var(--tint); }
.word-link strong { overflow-wrap: anywhere; font: 700 22px/1.15 var(--serif); }
.word-link span { color: var(--muted); font-size: 13px; }
.word-row .icon-button { width: 40px; height: 40px; border: 0; }
#pagination { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 17px; color: var(--muted); font-size: 13px; }
.empty { padding: 40px 10px; text-align: center; color: var(--muted); }
dialog { width: min(530px, calc(100% - 32px)); max-height: calc(100% - 40px); padding: 25px; background: var(--surface); border: 1px solid var(--line); border-radius: 19px; color: var(--ink); }
dialog::backdrop { background: #242b1f60; }
.dialog-heading { margin-bottom: 16px; }
.dialog-heading h2 { font-size: 30px; overflow-wrap: anywhere; }
.dialog-heading .icon-button { flex-shrink: 0; width: 40px; height: 40px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid var(--divider); }
.setting-row select { padding: 7px 10px; border: 1px solid var(--divider); border-radius: 8px; background: var(--surface); }
.muted { margin: 9px 0 19px; color: var(--muted); font-size: 14px; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 19px; }
#toast { position: fixed; z-index: 1; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 9px 16px; border-radius: 9px; background: var(--ink); color: white; font-size: 14px; }
#toast:empty { display: none; }
@media (max-width: 800px) {
  .shell { width: calc(100% - 32px); }
  .site-header { padding: 12px 0; }

  nav { gap: 4px; }
  .nav-button { font-size: 17px; gap: 5px; padding: 7px 10px; }
  .nav-button svg, .page-heading .button svg { width: 18px; height: 18px; }
  .page-heading { padding: 22px 0 19px; }
  h1 { font-size: clamp(26px, 5.5vw, 36px); }
  .page-heading p { font-size: clamp(14px, 3.6vw, 18px); }
  .page-heading .button { padding: 7px 9px; font-size: 13px; gap: 5px; flex-shrink: 0; }
  .layout { grid-template-columns: 1fr; gap: 20px; }
  .flashcard { padding: 17px 16px 18px; }
  .tag { padding: 5px 10px; font-size: 15px; }
  .card-progress { margin-top: 17px; font-size: 17px; }
  .word-face { min-height: 190px; padding: 26px 0; }
  .word-face h2 { font-size: clamp(54px, 11.5vw, 92px); }
  .word-face h2.long { font-size: clamp(34px, 8vw, 58px); }
  .word-face h2.phrase { font-size: clamp(31px, 7vw, 50px); }
  .pronounce { margin-top: 12px; }
  .example { padding: 13px 14px; }
  .actions { margin-top: 13px; }
  .actions .primary { font-size: 20px; }
  .stats-header h2, .groups h2 { font-size: 23px; }
  .stats { padding: 17px 16px 8px; }
  .stats .meter { margin: 14px 0; }
  .groups { margin-top: 15px; }
  footer { padding-inline: 0; font-size: 12px; }
  #library { padding: 16px; }
  .library-controls .button { padding: 8px; font-size: 13px; white-space: nowrap; }
  .library-controls .button svg { width: 16px; height: 16px; }
  .search-field { padding-inline: 8px; gap: 5px; }
  .search-field input { font-size: 16px; }
  .search-field input::placeholder { font-size: 12px; }
  .word-link strong { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

<script>
(async () => {
  const locked = document.getElementById('locked');
  const savedKeyName = 'wordroom-link-key-v1';
  const linkedKey = window.location.hash.slice(1);
  const decode = value => Uint8Array.from(atob(value.replace(/-/g, '+').replace(/_/g, '/')), char => char.charCodeAt(0));
  try {
    let secret = linkedKey;
    if (!secret) {
      try { secret = localStorage.getItem(savedKeyName); } catch {}
    }
    if (!secret || !/^[A-Za-z0-9_-]{43}$/.test(secret)) {
      locked.textContent = '请在 Safari 打开收到的完整链接。';
      return;
    }
    const payload = document.getElementById('wordroom-payload');
    const key = await crypto.subtle.importKey('raw', decode(secret), 'AES-GCM', false, ['decrypt']);
    const code = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(payload.dataset.iv) }, key, decode(payload.textContent.trim()));
    try { localStorage.setItem(savedKeyName, secret); } catch {}
    const script = document.createElement('script');
    script.textContent = new TextDecoder().decode(code);
    document.body.append(script);
    document.querySelector('.shell').hidden = false;
    locked.hidden = true;
  } catch {
    locked.textContent = '无法打开词库。请在 Safari 重新打开收到的完整链接。';
  }
})();
</script>
